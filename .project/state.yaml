    Local durable Bridge v0.1 is accepted with managed ChatGPT coding through a
    restricted WSL2 backend. External transport and autonomous publication remain
    pending; the generated coding-task commit stays local. Outbound transport
    code merged via PR #23; live activation/external acceptance remain unverified.
    Assistant Gateway scope recorded in Issue #25, without runtime changes.

