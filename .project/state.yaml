schema_version: "0.2"

project:
  name: "Personal AI Brain / Agent Platform"
  workstream: "Agent Platform Foundation"
  owner: "Project OS & Agent Architecture chat"

status: "active"
phase: "chatgpt-codex-local-bridge-v01-accepted"

current_gate: >
  Local Bridge v0.1 remains locally accepted (PR #20). Outbound Windows remote
  transport implementation merged on 2026-10-25 (PR #23), but live Windows
  credential/install/startup/readiness have not been independently verified here.
  Issue #22 Remote Transport Activation and external ChatGPT-originated acceptance
  remain OPEN; READY_FOR_EXTERNAL_CHATGPT_ACCEPTANCE is not established.
  Remote approvals, automatic review/correction, autonomous publication/deployment
  remain disabled. Core Agent stays read-only.

current_state: >
  Credentialless Coding Agent Broker v0.1 foundation and ChatGPT/Codex Local Bridge
  v0.1 durable core are completed. Windows retains the durable ledger, strict
  request/task identity and payload hashing, idempotency, no-silent-replay recovery,
  approval_required semantics, bounded dispatcher/lifecycle and result allowlist.
  The fixed Debian WSL2 Codex backend uses Linux task checkouts, managed ChatGPT
  authentication and offline root-deny sandbox isolation. A fresh real coding task
  completed in one turn, passed 40 sandboxed tests and produced a local-only commit;
  duplicate/conflict checks passed without another turn. Final validation: 83 Windows
  bridge tests and 318 full Homelab regression tests. PR #20 merged as
  cfd57bb639c7925ba984d80c9477fa4a0bb04812 with green CI. The merged package is
  installed in the Windows project venv; an intentionally invoked local API task
  succeeded with one turn and stored duplicate result. Private ledger ACLs are
  limited to the user, SYSTEM and Administrators. Native Windows MXC is unsupported
  and deferred for the tested build due to independently reproduced workspace
  failures. Previous uncertain/interrupted tasks and generated task commit remain
  preserved. Existing Homelab production broker/provider gates and services were
  not changed by the Bridge milestone; their older observations remain historical.
  Core credential maintenance completed on 2026-10-23: replacement verified with
  four fresh Core capabilities, canonical Issues owner fixed, and one read-only
  Issue roundtrip completed. Post-expiry Core and transport checks passed on
  2026-10-25. This does not by itself activate transport into the Windows Local Bridge.
  On 2026-10-25 PR #23 merged the bounded outbound Windows Issues mailbox and
  strict pab-codex/v0.1 adapter; CI passed and PR evidence reports 143 focused
  Windows tests. Runtime installation, dedicated credential permission checks,
  actual startup, Homelab coexistence and external ChatGPT acceptance were not
  demonstrated by this GitHub-only refresh. New specialist workstream Personal
  Assistant - ChatGPT & WhatsApp is scoped in Issue #25, blocked by Issue #22;
  its Gateway v0.1 and WhatsApp adapters are NOT implemented.

exact_next_action: >
  Platform owner: complete the approved Issue #22 Windows-local transport
  credential/installation/startup/least-privilege and Homelab coexistence checks
  for already-merged PR #23, then explicitly report READY_FOR_EXTERNAL_CHATGPT_ACCEPTANCE
  only if live prerequisites pass. Independent ChatGPT caller then tests one
  bounded real request, duplicate/conflict, recovery and correlated result delivery;
  do not create a test Issue before READY. On acceptance, close #22 and update
  Project State. Personal Assistant owner next implements Issue #25: one normalized
  ChatGPT request and one read-only Project OS status capability, with no WhatsApp
  integration until that contract is accepted.

blockers: []

dependencies:
